<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>递归式多模态推理模型视觉-语言-动作的研究</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="css/bootstrap.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
<style>
html, body {height: 100%; margin: 0; font-family: Arial, sans-serif;}
body {background: #f7f8fb;}
#pdf-frame {position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; border: none;}
#pdf-fallback {display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 24px; overflow: auto; background: #fff;}
#pdf-fallback p {margin: 0 0 16px; color: #333;}
#pdf-fallback a {color: #337ab7; text-decoration: none;}
#pdf-fallback a:hover {text-decoration: underline;}
</style>
</head>
<body>
<iframe id="pdf-frame" src="" allowfullscreen></iframe>
<div id="pdf-fallback">
  <p>PDF 无法直接预览，请点击下面链接查看：</p>
  <p><a id="fallback-link" href="#" target="_blank">打开 PDF</a></p>
</div>
<script>
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}
const file = getQueryParam('file') || 'docs/递归式多模态推理模型视觉-语言-动作的研究.pdf';
const iframe = document.getElementById('pdf-frame');
const fallbackLink = document.getElementById('fallback-link');
iframe.src = file;
fallbackLink.href = file;
iframe.addEventListener('error', () => {
  document.getElementById('pdf-frame').style.display = 'none';
  document.getElementById('pdf-fallback').style.display = 'block';
});
</script>
</body>
</html>
